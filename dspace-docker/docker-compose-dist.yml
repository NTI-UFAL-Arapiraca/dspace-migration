networks:
  dspacenet:
    name: ${COMPOSE_PROJECT_NAME}_dspacenet
    external: true
services:
  dspace-angular:
    container_name: dspace-angular
    build:
      context: .
      dockerfile: Dockerfile.angular
      args:
        DSPACE_ANGULAR_TAG: ${DSPACE_ANGULAR_TAG:-dspace-10_x}
    environment:
      # Runtime configuration is externalized so ordinary config changes do not
      # require rebuilding the Angular distribution.
      DSPACE_APP_CONFIG_PATH: /app/config/local/config.prod.yml
      DSPACE_UI_SSL: ${DSPACE_UI_SSL:-false}
      DSPACE_UI_HOST: ${DSPACE_UI_HOST:-dspace-angular}
      DSPACE_UI_PORT: ${DSPACE_UI_PORT:-4000}
      DSPACE_UI_NAMESPACE: ${DSPACE_UI_NAMESPACE:-/}
      DSPACE_UI_BASEURL: ${DSPACE_UI_BASEURL:-http://localhost:4000}
      DSPACE_REST_SSL: ${DSPACE_REST_SSL:-false}
      DSPACE_REST_HOST: ${DSPACE_REST_HOST:-localhost}
      DSPACE_REST_PORT: ${DSPACE_REST_PORT:-8080}
      DSPACE_REST_NAMESPACE: ${DSPACE_REST_NAMESPACE:-/server}
      DSPACE_REST_SSRBASEURL: ${DSPACE_REST_SSRBASEURL:-http://dspace:8080/server}
    image: ${DSPACE_ANGULAR_IMAGE:-dspace-migration-angular}:${DSPACE_ANGULAR_TAG:-dspace-10_x}
    networks:
    - dspacenet
    ports:
    - published: 4000
      target: 4000
    volumes:
    - ./frontend/config/config.prod.yml:/app/config/local/config.prod.yml:ro
