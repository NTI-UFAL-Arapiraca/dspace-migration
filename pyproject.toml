[project]
name = "dspace-migration"
version = "0.1.0"
description = "Migrating local UFAL thesis repository to DSpace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dspace_migration"]

[project.scripts]
extract-metadata = "dspace_migration.cli:run_extract_metadata"
extract-pdfs = "dspace_migration.cli:run_extract_pdfs"
migrate = "dspace_migration.cli:migrate_all"
